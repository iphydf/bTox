name: toxcore
description: Bindings to c-toxcore, generated by hs-apigen around a hand-written core.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  convert: ^3.1.2
  ffi: ^2.1.3
  freezed_annotation: ^3.1.0
  wasm_ffi: ^2.0.7

dev_dependencies:
  build_runner: ^2.11.0
  ffigen: ^20.1.1
  freezed: ^3.2.0
  lints: ^6.0.0

ffigen:
  output: lib/ffi/generated/toxcore.ffi.dart
  headers:
    entry-points:
      - ../../tools/include/tox/tox.h
      - ../../tools/include/tox/tox_options.h
      - ../../tools/include/tox/tox_events.h
      - ../../tools/include/tox/tox_private.h
      - ../../tools/include/tox/toxav.h
      - ../../tools/include/tox/toxencryptsave.h
    include-directives:
      # Prevent system headers from being included.
      - "../../tools/include/tox/*.h"
  functions:
    exclude:
      - "tox_default_system"
      - "tox_new_testing"
      - "tox_events_load"
      - "tox_events_equal"
  structs:
    exclude:
      - "Tox_System"
      - "Tox_Options_Testing"
    # We only pass a Tox_System on, from tox_get_system.
    dependency-only: opaque
  name: ToxFfi
  description: Bindings to TokTok/c-toxcore.
  silence-enum-warning: true
  compiler-opts:
    - "-DTOX_HIDE_DEPRECATED"
